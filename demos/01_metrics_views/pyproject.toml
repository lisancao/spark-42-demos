[project]
name = "metrics-views-demo"
version = "0.1.0"
description = "Spark 4.2 Metric Views demo — 'the dashboard that lied to you'"
requires-python = ">=3.10"
dependencies = [
    # Spark Connect client. Point it at the sandbox 4.2 server (sc://localhost:15099).
    # Pin to match the server's Spark version once an official 4.2 wheel is published;
    # the snapshot server accepts a recent 4.x connect client.
    "pyspark[connect]>=4.1.0",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["ipykernel", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
