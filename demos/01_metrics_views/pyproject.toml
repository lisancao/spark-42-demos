[project]
name = "metric-views-demo"
version = "0.2.0"
description = "Metric views in Apache Spark 4.2: examples, a behavior probe and supporting tools"
readme = "README.md"
# Python 3.10 matches the official apache/spark:4.2.0 image.
requires-python = "==3.10.*"
dependencies = []

[dependency-groups]
# The Python client with no JVM, with numpy and pyarrow for the data generator and the unit tests.
# PySpark warns against pandas 3, so pandas is pinned below 3.
client = ["pyspark-client==4.2.0", "pandas<3", "numpy", "pyarrow"]
# The full distribution with Connect support, for the Spark Classic tests and probe run.
full = ["pyspark[connect]==4.2.0", "pandas<3", "numpy", "pyarrow"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff"]

[tool.uv]
package = false
default-groups = ["client", "dev"]
conflicts = [[{ group = "client" }, { group = "full" }]]
compile-bytecode = true

[tool.pytest.ini_options]
pythonpath = [".", "tools", "tests", "grammar_probe"]
testpaths = ["tests"]
addopts = "-q --timeout=180"
markers = ["connect: requires a reachable Spark Connect server (SPARK_REMOTE)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
# Modules on the pytest pythonpath, imported by the tests
known-first-party = ["figures", "generate_data", "probe"]
