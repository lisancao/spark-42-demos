<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1420"/>
      <stop offset="1" stop-color="#0b0f18"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5b6b86"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1240" height="720" fill="url(#bg)"/>

  <!-- Title -->
  <text x="48" y="58" fill="#eef2f8" font-size="30" font-weight="700">Demo 1 — Metric Views</text>
  <text x="48" y="88" fill="#8ea0bd" font-size="17">“The dashboard that lied to you.”  Define the metric once — correct at every grain.</text>

  <!-- ============ ROW 1: build the data ============ -->
  <text x="48" y="140" fill="#6c7f9e" font-size="13" font-weight="600" letter-spacing="1.5">① BUILD THE DATA  ·  pure Python, no Spark</text>

  <!-- generate_data -->
  <g filter="url(#soft)">
    <rect x="48" y="156" width="230" height="92" rx="12" fill="#182234" stroke="#2b3a556e"/>
  </g>
  <text x="66" y="186" fill="#eef2f8" font-size="16" font-weight="700">generate_data.py</text>
  <text x="66" y="209" fill="#93a6c4" font-size="13">numpy → Parquet (PyArrow)</text>
  <text x="66" y="231" fill="#7d90ae" font-size="12.5">seed=42 · engineered footguns</text>

  <!-- tables -->
  <g filter="url(#soft)">
    <rect x="360" y="156" width="250" height="92" rx="12" fill="#182234" stroke="#2b3a556e"/>
  </g>
  <text x="378" y="186" fill="#eef2f8" font-size="16" font-weight="700">register_tables()</text>
  <text x="378" y="209" fill="#93a6c4" font-size="13">saveAsTable → catalog</text>
  <text x="378" y="231" fill="#7d90ae" font-size="12.5">users · sessions (79k) · orders</text>

  <line x1="278" y1="202" x2="352" y2="202" stroke="#5b6b86" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="648" y="196" fill="#6c7f9e" font-size="12.5">persistent tables</text>
  <text x="648" y="216" fill="#6c7f9e" font-size="12.5">(metric views can’t</text>
  <text x="648" y="234" fill="#6c7f9e" font-size="12.5">read temp views)</text>

  <!-- ============ ROW 2: the fork ============ -->
  <text x="48" y="312" fill="#6c7f9e" font-size="13" font-weight="600" letter-spacing="1.5">② SAME DATA, TWO PATHS</text>

  <!-- THE LIE -->
  <g filter="url(#soft)">
    <rect x="48" y="330" width="540" height="220" rx="14" fill="#221019" stroke="#7a2f45"/>
  </g>
  <text x="72" y="366" fill="#ff8ba3" font-size="16" font-weight="700">✗  THE LIE — plain SQL, any Spark 4.x</text>

  <rect x="72" y="386" width="234" height="140" rx="10" fill="#2a121d" stroke="#5c2537"/>
  <text x="90" y="412" fill="#e8b7c4" font-size="13" font-weight="600">Conversion rate</text>
  <text x="90" y="438" fill="#9fb0cc" font-size="12.5">AVG(per-region rate)</text>
  <text x="90" y="474" fill="#ff6f8b" font-size="30" font-weight="800">23.8%</text>
  <text x="90" y="500" fill="#8ea0bd" font-size="12">truth: 9.2%  ·  2.6× off</text>

  <rect x="330" y="386" width="234" height="140" rx="10" fill="#2a121d" stroke="#5c2537"/>
  <text x="348" y="412" fill="#e8b7c4" font-size="13" font-weight="600">Monthly active users</text>
  <text x="348" y="438" fill="#9fb0cc" font-size="12.5">SUM(daily distinct)</text>
  <text x="348" y="474" fill="#ff6f8b" font-size="30" font-weight="800">69,420</text>
  <text x="348" y="500" fill="#8ea0bd" font-size="12">truth: 9,994  ·  6.9× off</text>

  <!-- THE FIX -->
  <g filter="url(#soft)">
    <rect x="652" y="330" width="540" height="220" rx="14" fill="#0e2018" stroke="#256b4a"/>
  </g>
  <text x="676" y="366" fill="#7ee2ac" font-size="16" font-weight="700">✓  THE FIX — Spark 4.2 Metric View</text>

  <rect x="676" y="386" width="492" height="140" rx="10" fill="#0c1a14" stroke="#1f5238"/>
  <text x="694" y="411" fill="#a7d8bf" font-size="12.5" font-family="monospace">CREATE VIEW delivery_metrics WITH METRICS</text>
  <text x="694" y="431" fill="#8fb6a2" font-size="12" font-family="monospace">  LANGUAGE YAML AS $$ … $$</text>
  <text x="694" y="459" fill="#cfeadd" font-size="12.5">dims: region · session_date</text>
  <text x="694" y="481" fill="#cfeadd" font-size="12.5">measures: conversion_rate = SUM/COUNT</text>
  <text x="694" y="503" fill="#cfeadd" font-size="12.5">          active_users = COUNT(DISTINCT)</text>

  <!-- fork arrows -->
  <line x1="430" y1="250" x2="320" y2="326" stroke="#7a3247" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="250" x2="850" y2="326" stroke="#256b4a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ ROW 3: MEASURE at grains ============ -->
  <text x="652" y="596" fill="#6c7f9e" font-size="13" font-weight="600" letter-spacing="1.5">③ QUERY WITH MEASURE() — one definition, every grain</text>

  <g font-size="13">
    <rect x="652" y="612" width="158" height="76" rx="10" fill="#132a20" stroke="#256b4a"/>
    <text x="668" y="638" fill="#9fe0bd" font-weight="700">Overall</text>
    <text x="668" y="662" fill="#dff3e9" font-size="18" font-weight="800">9.2%</text>
    <text x="668" y="681" fill="#7fa992" font-size="11.5">= the truth ✓</text>

    <rect x="822" y="612" width="158" height="76" rx="10" fill="#132a20" stroke="#256b4a"/>
    <text x="838" y="638" fill="#9fe0bd" font-weight="700">By region</text>
    <text x="838" y="662" fill="#dff3e9" font-size="13">7.9% … 51.5%</text>
    <text x="838" y="681" fill="#7fa992" font-size="11.5">re-aggregated ✓</text>

    <rect x="992" y="612" width="200" height="76" rx="10" fill="#132a20" stroke="#256b4a"/>
    <text x="1008" y="638" fill="#9fe0bd" font-weight="700">By day</text>
    <text x="1008" y="662" fill="#dff3e9" font-size="12.5">DAU ≠ Σ  (no double-count)</text>
    <text x="1008" y="681" fill="#7fa992" font-size="11.5">distinct deferred ✓</text>
  </g>

  <line x1="900" y1="550" x2="820" y2="606" stroke="#256b4a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- consumers footnote -->
  <text x="48" y="640" fill="#6c7f9e" font-size="13" font-weight="600" letter-spacing="1.5">→ ONE GOVERNED NUMBER</text>
  <text x="48" y="666" fill="#93a6c4" font-size="13.5">SQL analyst · BI tool · AI tool (over Spark Connect)</text>
  <text x="48" y="687" fill="#6c7f9e" font-size="12.5">all hit the same delivery_metrics — Demo 2 rides this exact server</text>
</svg>
