<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect width="1100" height="430" fill="#ffffff"/><rect x="40.0" y="20.0" width="470.0" height="120.0" rx="6" fill="#f4f3f0" stroke="#c3c2b7" stroke-width="1"/><text x="56.0" y="42.0" font-family="Noto Sans" font-size="13" font-weight="600" fill="#52514e" text-anchor="start" xml:space="preserve">Query</text><text x="56.0" y="66.0" font-family="DejaVu Sans Mono" font-size="15" font-weight="400" fill="#1f1f1d" text-anchor="start" xml:space="preserve">SELECT region, MEASURE(conversion_rate)</text><text x="56.0" y="87.0" font-family="DejaVu Sans Mono" font-size="15" font-weight="400" fill="#1f1f1d" text-anchor="start" xml:space="preserve">FROM delivery_metrics</text><text x="56.0" y="108.0" font-family="DejaVu Sans Mono" font-size="15" font-weight="400" fill="#1f1f1d" text-anchor="start" xml:space="preserve">GROUP BY region</text><rect x="590.0" y="20.0" width="470.0" height="120.0" rx="6" fill="#f4f3f0" stroke="#c3c2b7" stroke-width="1"/><text x="606.0" y="42.0" font-family="Noto Sans" font-size="13" font-weight="600" fill="#52514e" text-anchor="start" xml:space="preserve">Definition in delivery_metrics</text><text x="606.0" y="66.0" font-family="DejaVu Sans Mono" font-size="15" font-weight="400" fill="#1f1f1d" text-anchor="start" xml:space="preserve">source: sessions</text><text x="606.0" y="87.0" font-family="DejaVu Sans Mono" font-size="15" font-weight="400" fill="#1f1f1d" text-anchor="start" xml:space="preserve">conversion_rate:</text><text x="606.0" y="108.0" font-family="DejaVu Sans Mono" font-size="15" font-weight="400" fill="#1f1f1d" text-anchor="start" xml:space="preserve">  SUM(CAST(converted AS INT)) / COUNT(1)</text><line x1="275.0" y1="140.0" x2="275.0" y2="196.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="825.0" y1="140.0" x2="825.0" y2="196.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="287.0" y="174.0" font-family="Noto Sans" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" xml:space="preserve">MEASURE(conversion_rate) is replaced</text><text x="837.0" y="174.0" font-family="Noto Sans" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" xml:space="preserve">by this expression</text><rect x="40.0" y="200.0" width="1020.0" height="100.0" rx="6" fill="#f4f3f0" stroke="#c3c2b7" stroke-width="1"/><text x="56.0" y="222.0" font-family="Noto Sans" font-size="13" font-weight="600" fill="#52514e" text-anchor="start" xml:space="preserve">Equivalent aggregation</text><text x="56.0" y="246.0" font-family="DejaVu Sans Mono" font-size="15" font-weight="400" fill="#1f1f1d" text-anchor="start" xml:space="preserve">SELECT region, SUM(CAST(converted AS INT)) / COUNT(1)</text><text x="56.0" y="267.0" font-family="DejaVu Sans Mono" font-size="15" font-weight="400" fill="#1f1f1d" text-anchor="start" xml:space="preserve">FROM sessions GROUP BY region</text><line x1="550.0" y1="300.0" x2="550.0" y2="346.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="562.0" y="328.0" font-family="Noto Sans" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" xml:space="preserve">evaluated at the query's grain</text><rect x="40.0" y="350.0" width="1020.0" height="60.0" rx="6" fill="#e7f6ef" stroke="#1baf7a" stroke-width="1.5"/><text x="56.0" y="372.0" font-family="Noto Sans" font-size="13" font-weight="600" fill="#52514e" text-anchor="start" xml:space="preserve">Result, one conversion rate for each region</text><text x="56.0" y="396.0" font-family="DejaVu Sans Mono" font-size="15" font-weight="400" fill="#1f1f1d" text-anchor="start" xml:space="preserve">metro 0.0787    urban 0.0990    suburban 0.1218    rural 0.3775    remote 0.5150</text></svg>
