<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="536" viewBox="0 0 1100 536"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect width="1100" height="536" fill="#ffffff"/><rect x="40.0" y="22.0" width="540.0" height="488.0" rx="6" fill="#f4f3f0" stroke="#c3c2b7" stroke-width="1"/><text x="60.0" y="44.0" font-family="DejaVu Sans Mono" font-size="15" font-weight="700" fill="#1f1f1d" text-anchor="start" xml:space="preserve">CREATE VIEW delivery_metrics</text><line x1="592.0" y1="39.0" x2="628.0" y2="39.0" stroke="#898781" stroke-width="1"/><text x="636.0" y="44.0" font-family="Noto Sans" font-size="14" font-weight="400" fill="#52514e" text-anchor="start" xml:space="preserve">The view's name in the catalog</text><text x="60.0" y="66.0" font-family="DejaVu Sans Mono" font-size="15" font-weight="700" fill="#1f1f1d" text-anchor="start" xml:space="preserve">  WITH METRICS</text><line x1="592.0" y1="61.0" x2="628.0" y2="61.0" stroke="#898781" stroke-width="1"/><text x="636.0" y="66.0" font-family="Noto Sans" font-size="14" font-weight="400" fill="#52514e" text-anchor="start" xml:space="preserve">Makes the view a metric view</text><text x="60.0" y="88.0" font-family="DejaVu Sans Mono" font-size="15" font-weight="700" fill="#1f1f1d" text-anchor="start" xml:space="preserve">  LANGUAGE YAML</text><line x1="592.0" y1="83.0" x2="628.0" y2="83.0" stroke="#898781" stroke-width="1"/><text x="636.0" y="88.0" font-family="Noto Sans" font-size="14" font-weight="400" fill="#52514e" text-anchor="start" xml:space="preserve">Required; YAML is the only language</text><text x="60.0" y="110.0" font-family="DejaVu Sans Mono" font-size="15" font-weight="700" fill="#1f1f1d" text-anchor="start" xml:space="preserve">AS $$</text><line x1="592.0" y1="105.0" x2="628.0" y2="105.0" stroke="#898781" stroke-width="1"/><text x="636.0" y="110.0" font-family="Noto Sans" font-size="14" font-weight="400" fill="#52514e" text-anchor="start" xml:space="preserve">The definition is a dollar-quoted string</text><text x="60.0" y="132.0" font-family="DejaVu Sans Mono" font-size="15" font-weight="400" fill="#1f1f1d" text-anchor="start" xml:space="preserve">version: 0.1</text><line x1="592.0" y1="127.0" x2="628.0" y2="127.0" stroke="#898781" stroke-width="1"/><text x="636.0" y="132.0" font-family="Noto Sans" font-size="14" font-weight="400" fill="#52514e" text-anchor="start" xml:space="preserve">Only 0.1 is accepted in Spark 4.2.0</text><text x="60.0" y="154.0" font-family="DejaVu Sans Mono" font-size="15" font-weight="400" fill="#1f1f1d" text-anchor="start" xml:space="preserve">source: sessions</text><line x1="592.0" y1="149.0" x2="628.0" y2="149.0" stroke="#898781" stroke-width="1"/><text x="636.0" y="154.0" font-family="Noto Sans" font-size="14" font-weight="400" fill="#52514e" text-anchor="start" xml:space="preserve">A table, a view or a SQL query</text><text x="60.0" y="176.0" font-family="DejaVu Sans Mono" font-size="15" font-weight="400" fill="#1f1f1d" text-anchor="start" xml:space="preserve">dimensions:</text><line x1="592.0" y1="171.0" x2="628.0" y2="171.0" stroke="#898781" stroke-width="1"/><text x="636.0" y="176.0" font-family="Noto Sans" font-size="14" font-weight="400" fill="#52514e" text-anchor="start" xml:space="preserve">Columns that a query groups or filters by</text><text x="60.0" y="198.0" font-family="DejaVu Sans Mono" font-size="15" font-weight="400" fill="#1f1f1d" text-anchor="start" xml:space="preserve">  - name: region</text><text x="60.0" y="220.0" font-family="DejaVu Sans Mono" font-size="15" font-weight="400" fill="#1f1f1d" text-anchor="start" xml:space="preserve">    expr: region</text><text x="60.0" y="242.0" font-family="DejaVu Sans Mono" font-size="15" font-weight="400" fill="#1f1f1d" text-anchor="start" xml:space="preserve">  - name: session_date</text><text x="60.0" y="264.0" font-family="DejaVu Sans Mono" font-size="15" font-weight="400" fill="#1f1f1d" text-anchor="start" xml:space="preserve">    expr: session_date</text><text x="60.0" y="286.0" font-family="DejaVu Sans Mono" font-size="15" font-weight="400" fill="#1f1f1d" text-anchor="start" xml:space="preserve">measures:</text><line x1="592.0" y1="281.0" x2="628.0" y2="281.0" stroke="#898781" stroke-width="1"/><text x="636.0" y="286.0" font-family="Noto Sans" font-size="14" font-weight="400" fill="#52514e" text-anchor="start" xml:space="preserve">Aggregate expressions, evaluated at the grain of each query</text><text x="60.0" y="308.0" font-family="DejaVu Sans Mono" font-size="15" font-weight="400" fill="#1f1f1d" text-anchor="start" xml:space="preserve">  - name: total_sessions</text><text x="60.0" y="330.0" font-family="DejaVu Sans Mono" font-size="15" font-weight="400" fill="#1f1f1d" text-anchor="start" xml:space="preserve">    expr: COUNT(1)</text><text x="60.0" y="352.0" font-family="DejaVu Sans Mono" font-size="15" font-weight="400" fill="#1f1f1d" text-anchor="start" xml:space="preserve">  - name: converted_sessions</text><text x="60.0" y="374.0" font-family="DejaVu Sans Mono" font-size="15" font-weight="400" fill="#1f1f1d" text-anchor="start" xml:space="preserve">    expr: SUM(CAST(converted AS INT))</text><text x="60.0" y="396.0" font-family="DejaVu Sans Mono" font-size="15" font-weight="400" fill="#1f1f1d" text-anchor="start" xml:space="preserve">  - name: conversion_rate</text><text x="60.0" y="418.0" font-family="DejaVu Sans Mono" font-size="15" font-weight="400" fill="#1f1f1d" text-anchor="start" xml:space="preserve">    expr: SUM(CAST(converted AS INT)) / COUNT(1)</text><text x="60.0" y="440.0" font-family="DejaVu Sans Mono" font-size="15" font-weight="400" fill="#1f1f1d" text-anchor="start" xml:space="preserve">  - name: active_users</text><text x="60.0" y="462.0" font-family="DejaVu Sans Mono" font-size="15" font-weight="400" fill="#1f1f1d" text-anchor="start" xml:space="preserve">    expr: COUNT(DISTINCT user_id)</text><text x="60.0" y="484.0" font-family="DejaVu Sans Mono" font-size="15" font-weight="700" fill="#1f1f1d" text-anchor="start" xml:space="preserve">$$</text><line x1="628.0" y1="294.0" x2="628.0" y2="466.0" stroke="#898781" stroke-width="1"/><line x1="622.0" y1="294.0" x2="628.0" y2="294.0" stroke="#898781" stroke-width="1"/><line x1="622.0" y1="466.0" x2="628.0" y2="466.0" stroke="#898781" stroke-width="1"/><text x="636.0" y="385.0" font-family="Noto Sans" font-size="14" font-weight="400" fill="#52514e" text-anchor="start" xml:space="preserve">Four measures, each a name and an aggregate expr</text></svg>
