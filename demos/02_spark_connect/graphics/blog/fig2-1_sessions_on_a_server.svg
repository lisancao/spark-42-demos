<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect width="1100" height="440" fill="#ffffff"/><rect x="400" y="30" width="660" height="386" rx="10" fill="#fffaf7" stroke="#eb6834" stroke-width="1.5"/><text x="424" y="62" font-family="Noto Sans" font-size="17" font-weight="700" font-style="normal" fill="#1f1f1d" text-anchor="start">Spark Connect server (one JVM)</text><rect x="40" y="88" width="240" height="76" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="160.0" y="121.1" font-family="Noto Sans" font-size="17" font-weight="600" font-style="normal" fill="#1f1f1d" text-anchor="middle">Notebook kernel</text><text x="160.0" y="142.1" font-family="Noto Sans" font-size="14" font-weight="400" font-style="normal" fill="#52514e" text-anchor="middle">pyspark-client</text><line x1="280" y1="126" x2="422" y2="126" stroke="#52514e" stroke-width="1.75" marker-end="url(#a)"/><rect x="424" y="88" width="360" height="76" rx="6" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/><text x="604.0" y="111.1" font-family="Noto Sans" font-size="17" font-weight="600" font-style="normal" fill="#1f1f1d" text-anchor="middle">Session 1</text><text x="604.0" y="132.1" font-family="Noto Sans" font-size="14" font-weight="400" font-style="normal" fill="#52514e" text-anchor="middle">Temporary views, session configuration,</text><text x="604.0" y="152.1" font-family="Noto Sans" font-size="14" font-weight="400" font-style="normal" fill="#52514e" text-anchor="middle">current catalog, artifacts</text><rect x="40" y="180" width="240" height="76" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="160.0" y="213.1" font-family="Noto Sans" font-size="17" font-weight="600" font-style="normal" fill="#1f1f1d" text-anchor="middle">Notebook kernel</text><text x="160.0" y="234.1" font-family="Noto Sans" font-size="14" font-weight="400" font-style="normal" fill="#52514e" text-anchor="middle">pyspark-client</text><line x1="280" y1="218" x2="422" y2="218" stroke="#52514e" stroke-width="1.75" marker-end="url(#a)"/><rect x="424" y="180" width="360" height="76" rx="6" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/><text x="604.0" y="203.1" font-family="Noto Sans" font-size="17" font-weight="600" font-style="normal" fill="#1f1f1d" text-anchor="middle">Session 2</text><text x="604.0" y="224.1" font-family="Noto Sans" font-size="14" font-weight="400" font-style="normal" fill="#52514e" text-anchor="middle">Temporary views, session configuration,</text><text x="604.0" y="244.1" font-family="Noto Sans" font-size="14" font-weight="400" font-style="normal" fill="#52514e" text-anchor="middle">current catalog, artifacts</text><rect x="40" y="272" width="240" height="76" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="160.0" y="305.1" font-family="Noto Sans" font-size="17" font-weight="600" font-style="normal" fill="#1f1f1d" text-anchor="middle">CI job</text><text x="160.0" y="326.1" font-family="Noto Sans" font-size="14" font-weight="400" font-style="normal" fill="#52514e" text-anchor="middle">pyspark-client</text><line x1="280" y1="310" x2="422" y2="310" stroke="#52514e" stroke-width="1.75" marker-end="url(#a)"/><rect x="424" y="272" width="360" height="76" rx="6" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/><text x="604.0" y="295.1" font-family="Noto Sans" font-size="17" font-weight="600" font-style="normal" fill="#1f1f1d" text-anchor="middle">Session 3</text><text x="604.0" y="316.1" font-family="Noto Sans" font-size="14" font-weight="400" font-style="normal" fill="#52514e" text-anchor="middle">Temporary views, session configuration,</text><text x="604.0" y="336.1" font-family="Noto Sans" font-size="14" font-weight="400" font-style="normal" fill="#52514e" text-anchor="middle">current catalog, artifacts</text><text x="351" y="116" font-family="Noto Sans" font-size="14" font-weight="600" font-style="normal" fill="#52514e" text-anchor="middle">gRPC</text><rect x="808" y="88" width="228" height="260" rx="6" fill="#f4f3f0" stroke="#898781" stroke-width="1.5"/><text x="922.0" y="182.8" font-family="Noto Sans" font-size="16" font-weight="600" font-style="normal" fill="#1f1f1d" text-anchor="middle">Shared by every session</text><text x="922.0" y="203.8" font-family="Noto Sans" font-size="14" font-weight="400" font-style="normal" fill="#52514e" text-anchor="middle">JVM and its memory</text><text x="922.0" y="223.8" font-family="Noto Sans" font-size="14" font-weight="400" font-style="normal" fill="#52514e" text-anchor="middle">Executors</text><text x="922.0" y="243.8" font-family="Noto Sans" font-size="14" font-weight="400" font-style="normal" fill="#52514e" text-anchor="middle">Spark version</text><text x="922.0" y="263.8" font-family="Noto Sans" font-size="14" font-weight="400" font-style="normal" fill="#52514e" text-anchor="middle">Installed JARs</text><text x="424" y="392" font-family="Noto Sans" font-size="14" font-weight="400" font-style="normal" fill="#52514e" text-anchor="start">Sessions are isolated from one another; they share the server&#x27;s resources.</text></svg>
