<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect width="1100" height="440" fill="#ffffff"/><rect x="40" y="150" width="230" height="90" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="155.0" y="190.4" font-family="DejaVu Sans Mono" font-size="18" font-weight="400" font-style="normal" fill="#1f1f1d" text-anchor="middle">job.py</text><text x="155.0" y="211.4" font-family="Noto Sans" font-size="14" font-weight="400" font-style="normal" fill="#52514e" text-anchor="middle">unchanged</text><line x1="270" y1="195" x2="336" y2="195" stroke="#52514e" stroke-width="1.75" marker-end="url(#a)"/><rect x="340" y="160" width="240" height="70" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/><text x="460.0" y="200.1" font-family="DejaVu Sans Mono" font-size="17" font-weight="400" font-style="normal" fill="#1f1f1d" text-anchor="middle">spark.api.mode</text><polyline points="580,195 620,195 620,100 756,100" fill="none" stroke="#52514e" stroke-width="1.75" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="620,195 620,290 756,290" fill="none" stroke="#52514e" stroke-width="1.75" stroke-linejoin="round" marker-end="url(#a)"/><text x="688" y="90" font-family="Noto Sans" font-size="14" font-weight="600" font-style="normal" fill="#52514e" text-anchor="middle">classic (default)</text><text x="688" y="280" font-family="Noto Sans" font-size="14" font-weight="600" font-style="normal" fill="#52514e" text-anchor="middle">connect</text><rect x="760" y="50" width="300" height="100" rx="6" fill="#fdeee7" stroke="#eb6834" stroke-width="1.5"/><text x="910.0" y="85.1" font-family="Noto Sans" font-size="17" font-weight="600" font-style="normal" fill="#1f1f1d" text-anchor="middle">Spark Classic</text><text x="910.0" y="106.1" font-family="Noto Sans" font-size="14" font-weight="400" font-style="normal" fill="#52514e" text-anchor="middle">Py4J to the driver JVM</text><text x="910.0" y="126.1" font-family="Noto Sans" font-size="14" font-weight="400" font-style="normal" fill="#52514e" text-anchor="middle">on the application host</text><rect x="760" y="240" width="300" height="100" rx="6" fill="#fdeee7" stroke="#eb6834" stroke-width="1.5"/><text x="910.0" y="275.1" font-family="Noto Sans" font-size="17" font-weight="600" font-style="normal" fill="#1f1f1d" text-anchor="middle">Spark Connect</text><text x="910.0" y="296.1" font-family="Noto Sans" font-size="14" font-weight="400" font-style="normal" fill="#52514e" text-anchor="middle">Spark starts a Connect server</text><text x="910.0" y="316.1" font-family="Noto Sans" font-size="14" font-weight="400" font-style="normal" fill="#52514e" text-anchor="middle">and the job runs as its client</text><rect x="170" y="372" width="760" height="44" rx="6" fill="#fafaf8" stroke="#c3c2b7" stroke-width="1.5"/><text x="550" y="399" font-family="DejaVu Sans Mono" font-size="15" font-weight="400" font-style="normal" fill="#1f1f1d" text-anchor="middle">spark-submit --master spark://host:7077 --conf spark.api.mode=connect job.py</text></svg>
