<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect width="1100" height="590" fill="#ffffff"/><circle cx="70" cy="64" r="20" fill="#ffffff" stroke="#52514e" stroke-width="1.75"/><text x="70" y="70" font-family="Noto Sans" font-size="17" font-weight="700" font-style="normal" fill="#1f1f1d" text-anchor="middle">1</text><line x1="70" y1="84" x2="70" y2="134" stroke="#52514e" stroke-width="1.75" marker-end="url(#a)"/><rect x="110" y="30" width="720" height="68" rx="6" fill="#f4f3f0" stroke="#c3c2b7" stroke-width="1.5"/><text x="132" y="57" font-family="Noto Sans" font-size="14" font-weight="700" font-style="normal" fill="#52514e" text-anchor="start">Layers 2 and 3</text><text x="132" y="81" font-family="Noto Sans" font-size="16" font-weight="400" font-style="normal" fill="#1f1f1d" text-anchor="start">Stand up a correctly configured server and confirm it with a preflight check</text><circle cx="70" cy="156" r="20" fill="#ffffff" stroke="#52514e" stroke-width="1.75"/><text x="70" y="162" font-family="Noto Sans" font-size="17" font-weight="700" font-style="normal" fill="#1f1f1d" text-anchor="middle">2</text><line x1="70" y1="176" x2="70" y2="226" stroke="#52514e" stroke-width="1.75" marker-end="url(#a)"/><rect x="110" y="122" width="720" height="68" rx="6" fill="#f4f3f0" stroke="#c3c2b7" stroke-width="1.5"/><text x="132" y="149" font-family="Noto Sans" font-size="14" font-weight="700" font-style="normal" fill="#52514e" text-anchor="start">Layer 0</text><text x="132" y="173" font-family="Noto Sans" font-size="16" font-weight="400" font-style="normal" fill="#1f1f1d" text-anchor="start">Point one job at the server, using spark.api.mode so the change is reversible</text><circle cx="70" cy="248" r="20" fill="#ffffff" stroke="#52514e" stroke-width="1.75"/><text x="70" y="254" font-family="Noto Sans" font-size="17" font-weight="700" font-style="normal" fill="#1f1f1d" text-anchor="middle">3</text><line x1="70" y1="268" x2="70" y2="318" stroke="#52514e" stroke-width="1.75" marker-end="url(#a)"/><rect x="110" y="214" width="720" height="68" rx="6" fill="#f4f3f0" stroke="#c3c2b7" stroke-width="1.5"/><text x="132" y="241" font-family="Noto Sans" font-size="14" font-weight="700" font-style="normal" fill="#52514e" text-anchor="start">Layer 1</text><text x="132" y="265" font-family="Noto Sans" font-size="16" font-weight="400" font-style="normal" fill="#1f1f1d" text-anchor="start">Run the audit, fix blocking calls and review behavior findings</text><circle cx="70" cy="340" r="20" fill="#ffffff" stroke="#52514e" stroke-width="1.75"/><text x="70" y="346" font-family="Noto Sans" font-size="17" font-weight="700" font-style="normal" fill="#1f1f1d" text-anchor="middle">4</text><line x1="70" y1="360" x2="70" y2="410" stroke="#52514e" stroke-width="1.75" marker-end="url(#a)"/><rect x="110" y="306" width="720" height="68" rx="6" fill="#f4f3f0" stroke="#c3c2b7" stroke-width="1.5"/><text x="132" y="333" font-family="Noto Sans" font-size="14" font-weight="700" font-style="normal" fill="#52514e" text-anchor="start">Layer 4</text><text x="132" y="357" font-family="Noto Sans" font-size="16" font-weight="400" font-style="normal" fill="#1f1f1d" text-anchor="start">Move dependency distribution to addArtifact</text><circle cx="70" cy="432" r="20" fill="#ffffff" stroke="#52514e" stroke-width="1.75"/><text x="70" y="438" font-family="Noto Sans" font-size="17" font-weight="700" font-style="normal" fill="#1f1f1d" text-anchor="middle">5</text><line x1="70" y1="452" x2="70" y2="502" stroke="#52514e" stroke-width="1.75" marker-end="url(#a)"/><rect x="110" y="398" width="720" height="68" rx="6" fill="#f4f3f0" stroke="#c3c2b7" stroke-width="1.5"/><text x="132" y="425" font-family="Noto Sans" font-size="14" font-weight="700" font-style="normal" fill="#52514e" text-anchor="start">Layer 5</text><text x="132" y="449" font-family="Noto Sans" font-size="16" font-weight="400" font-style="normal" fill="#1f1f1d" text-anchor="start">Relocate logging and checkpoints, and retire submission wrappers</text><circle cx="70" cy="524" r="20" fill="#ffffff" stroke="#52514e" stroke-width="1.75"/><text x="70" y="530" font-family="Noto Sans" font-size="17" font-weight="700" font-style="normal" fill="#1f1f1d" text-anchor="middle">6</text><rect x="110" y="490" width="720" height="68" rx="6" fill="#fdeee7" stroke="#eb6834" stroke-width="1.5"/><text x="132" y="517" font-family="Noto Sans" font-size="14" font-weight="700" font-style="normal" fill="#52514e" text-anchor="start">Layer 6</text><text x="132" y="541" font-family="Noto Sans" font-size="16" font-weight="400" font-style="normal" fill="#1f1f1d" text-anchor="start">Remove credentials from clients</text><polyline points="852,30 868,30 868,466 852,466" fill="none" stroke="#52514e" stroke-width="1.75" stroke-linejoin="round"/><text x="886" y="240" font-family="Noto Sans" font-size="15" font-weight="700" font-style="normal" fill="#1f1f1d" text-anchor="start">Easily reversed:</text><text x="886" y="262" font-family="Noto Sans" font-size="15" font-weight="400" font-style="normal" fill="#52514e" text-anchor="start">a job can move back</text><text x="886" y="284" font-family="Noto Sans" font-size="15" font-weight="400" font-style="normal" fill="#52514e" text-anchor="start">to Spark Classic</text><polyline points="852,490 868,490 868,558 852,558" fill="none" stroke="#eb6834" stroke-width="1.75" stroke-linejoin="round"/><text x="886" y="518" font-family="Noto Sans" font-size="15" font-weight="700" font-style="normal" fill="#1f1f1d" text-anchor="start">Not easily reversed,</text><text x="886" y="540" font-family="Noto Sans" font-size="15" font-weight="400" font-style="normal" fill="#52514e" text-anchor="start">so it comes last</text></svg>
