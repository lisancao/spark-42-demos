<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
  <defs>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#2a2a4a" opacity="0.6"/>
    </pattern>
    <marker id="arrowOrange" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#e25a1c"/></marker>
    <marker id="arrowPurple" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#8957e5"/></marker>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="#1a1a2e"/>
  <rect x="0" y="0" width="1920" height="1080" fill="url(#dots)"/>
  <rect x="0" y="0" width="1920" height="6" fill="#e25a1c"/>

  <g stroke="#e25a1c" stroke-width="3" fill="none" opacity="0.35">
    <path d="M 40 100 L 40 40 L 100 40"/>
    <path d="M 1820 40 L 1880 40 L 1880 100"/>
    <path d="M 40 980 L 40 1062 L 64 1062"/>
    <path d="M 1880 980 L 1880 1062 L 1856 1062"/>
  </g>

  <text x="80" y="104" font-size="48" font-weight="700" fill="#e6edf3">From a Coupled Driver to a Client and a Server</text>
  <text x="80" y="150" font-size="26" fill="#8b949e">Why Spark Connect was proposed, and when it shipped</text>

  <!-- Left panel: Spark Classic -->
  <text x="110" y="240" font-size="34" font-weight="700" fill="#ff8a4c">Spark Classic</text>

  <rect x="110" y="255" width="780" height="150" rx="12" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="8,6"/>
  <text x="130" y="278" font-size="22" fill="#8b949e">Host</text>

  <rect x="150" y="290" width="340" height="80" rx="8" fill="#2a1a12" stroke="#e25a1c" stroke-width="2"/>
  <text x="320" y="325" font-size="24" fill="#e6edf3" text-anchor="middle">PySpark application</text>
  <text x="320" y="353" font-size="24" fill="#e6edf3" text-anchor="middle">(Python)</text>

  <text x="525" y="308" font-size="24" fill="#e6edf3" text-anchor="middle">Py4J</text>
  <line x1="500" y1="330" x2="550" y2="330" stroke="#e25a1c" stroke-width="3"/>

  <rect x="560" y="290" width="300" height="80" rx="8" fill="#2a1a12" stroke="#e25a1c" stroke-width="2"/>
  <text x="710" y="336" font-size="24" fill="#e6edf3" text-anchor="middle">Driver JVM</text>

  <line x1="710" y1="378" x2="710" y2="445" stroke="#e25a1c" stroke-width="3" marker-end="url(#arrowOrange)"/>

  <rect x="560" y="460" width="300" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="710" y="498" font-size="26" fill="#e6edf3" text-anchor="middle">Executors</text>

  <text x="110" y="560" font-size="24" fill="#8b949e">The application carries a Spark runtime and a JDK.</text>
  <text x="110" y="588" font-size="24" fill="#8b949e">It shares the driver&#x2019;s lifetime.</text>

  <!-- Right panel: Spark Connect -->
  <text x="1030" y="240" font-size="34" font-weight="700" fill="#b392f0">Spark Connect</text>

  <rect x="1230" y="260" width="380" height="60" rx="8" fill="#1f1a33" stroke="#8957e5" stroke-width="2"/>
  <text x="1420" y="298" font-size="24" fill="#e6edf3" text-anchor="middle">Client (Python, no JVM)</text>

  <line x1="1420" y1="328" x2="1420" y2="352" stroke="#8957e5" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <text x="1450" y="344" font-size="24" fill="#e6edf3">gRPC</text>

  <rect x="1210" y="360" width="420" height="60" rx="8" fill="#1f1a33" stroke="#8957e5" stroke-width="2"/>
  <text x="1420" y="397" font-size="24" fill="#e6edf3" text-anchor="middle">Connect server (driver JVM)</text>

  <line x1="1420" y1="428" x2="1420" y2="452" stroke="#8957e5" stroke-width="3" marker-end="url(#arrowPurple)"/>

  <rect x="1270" y="460" width="300" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="1420" y="498" font-size="26" fill="#e6edf3" text-anchor="middle">Executors</text>

  <text x="1030" y="560" font-size="24" fill="#8b949e">A client failure does not stop the driver.</text>
  <text x="1030" y="588" font-size="24" fill="#8b949e">The server can be upgraded without redeploying clients.</text>

  <!-- Timeline -->
  <line x1="150" y1="790" x2="1770" y2="790" stroke="#30363d" stroke-width="2"/>

  <!-- Point 1: June 2022 -->
  <circle cx="252" cy="790" r="8" fill="#8957e5"/>
  <text x="252" y="750" font-size="26" fill="#e6edf3" text-anchor="middle">June 2022</text>
  <text x="252" y="830" font-size="24" fill="#e6edf3" text-anchor="middle">SPIP filed</text>
  <text x="252" y="866" font-size="20" font-family="Consolas, 'Courier New', monospace" fill="#8b949e" text-anchor="middle">SPARK-39375</text>

  <!-- Point 2: April 2023 -->
  <circle cx="535" cy="790" r="8" fill="#8957e5"/>
  <text x="535" y="750" font-size="26" fill="#e6edf3" text-anchor="middle">April 2023</text>
  <text x="535" y="830" font-size="24" fill="#e6edf3" text-anchor="middle">Spark 3.4.0:</text>
  <text x="535" y="858" font-size="24" fill="#e6edf3" text-anchor="middle">Python client</text>

  <!-- Point 3: September 2023 -->
  <circle cx="818" cy="790" r="8" fill="#8957e5"/>
  <text x="818" y="750" font-size="26" fill="#e6edf3" text-anchor="middle">September 2023</text>
  <text x="818" y="830" font-size="24" fill="#e6edf3" text-anchor="middle">Spark 3.5.0: Scala</text>
  <text x="818" y="858" font-size="24" fill="#e6edf3" text-anchor="middle">and Go clients</text>
  <text x="818" y="894" font-size="20" font-family="Consolas, 'Courier New', monospace" fill="#8b949e" text-anchor="middle">SPARK-43351</text>

  <!-- Point 4: May 2025 -->
  <circle cx="1102" cy="790" r="8" fill="#8957e5"/>
  <text x="1102" y="750" font-size="26" fill="#e6edf3" text-anchor="middle">May 2025</text>
  <text x="1102" y="830" font-size="24" fill="#e6edf3" text-anchor="middle">Spark 4.0.0:</text>
  <text x="1102" y="858" font-size="24" fill="#e6edf3" text-anchor="middle">pyspark-client,</text>
  <text x="1102" y="886" font-size="24" fill="#e6edf3" text-anchor="middle">spark.api.mode</text>
  <text x="1102" y="922" font-size="20" font-family="Consolas, 'Courier New', monospace" fill="#8b949e" text-anchor="middle">SPARK-47540,</text>
  <text x="1102" y="946" font-size="20" font-family="Consolas, 'Courier New', monospace" fill="#8b949e" text-anchor="middle">SPARK-51212</text>

  <!-- Point 5: December 2025 -->
  <circle cx="1385" cy="790" r="8" fill="#8957e5"/>
  <text x="1385" y="750" font-size="26" fill="#e6edf3" text-anchor="middle">December 2025</text>
  <text x="1385" y="830" font-size="24" fill="#e6edf3" text-anchor="middle">Spark 4.1.0:</text>
  <text x="1385" y="858" font-size="24" fill="#e6edf3" text-anchor="middle">JDBC driver</text>
  <text x="1385" y="894" font-size="20" font-family="Consolas, 'Courier New', monospace" fill="#8b949e" text-anchor="middle">SPARK-53484</text>

  <!-- Point 6: July 2026 -->
  <circle cx="1668" cy="790" r="8" fill="#8957e5"/>
  <text x="1668" y="750" font-size="26" fill="#e6edf3" text-anchor="middle">July 2026</text>
  <text x="1668" y="830" font-size="24" fill="#e6edf3" text-anchor="middle">Spark 4.2.0:</text>
  <text x="1668" y="858" font-size="24" fill="#e6edf3" text-anchor="middle">RDD-style APIs,</text>
  <text x="1668" y="886" font-size="24" fill="#e6edf3" text-anchor="middle">execution status,</text>
  <text x="1668" y="914" font-size="24" fill="#e6edf3" text-anchor="middle">YARN cluster mode</text>
  <text x="1668" y="950" font-size="20" font-family="Consolas, 'Courier New', monospace" fill="#8b949e" text-anchor="middle">SPARK-55227,</text>
  <text x="1668" y="974" font-size="20" font-family="Consolas, 'Courier New', monospace" fill="#8b949e" text-anchor="middle">SPARK-55606,</text>
  <text x="1668" y="998" font-size="20" font-family="Consolas, 'Courier New', monospace" fill="#8b949e" text-anchor="middle">SPARK-55239</text>

  <text x="80" y="1046" font-size="20" fill="#8b949e">Source: blog post &#xa7;1, Table 1-2</text>
</svg>
