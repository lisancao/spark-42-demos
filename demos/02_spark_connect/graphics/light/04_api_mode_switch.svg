<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
  <defs>
    <pattern id="dotgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#d8dee4" opacity="0.6"/>
    </pattern>
    <marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#d9531a"/></marker>
    <marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#8250df"/></marker>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="#f6f8fa"/>
  <rect x="0" y="0" width="1920" height="1080" fill="url(#dotgrid)"/>
  <rect x="0" y="0" width="1920" height="6" fill="#d9531a"/>

  <g stroke="#d9531a" stroke-width="3" opacity="0.35" fill="none">
    <path d="M 30 90 L 30 30 L 90 30"/>
    <path d="M 1830 30 L 1890 30 L 1890 90"/>
    <path d="M 30 990 L 30 1062 L 64 1062"/>
    <path d="M 1890 990 L 1890 1062 L 1856 1062"/>
  </g>

  <text x="80" y="104" font-size="48" font-weight="700" fill="#1f2328">spark.api.mode: One Job, Two Execution Paths</text>
  <text x="80" y="150" font-size="26" fill="#57606a">Introduced in Spark 4.0</text>

  <!-- job.py file card and submit command -->
  <rect x="80" y="210" width="220" height="80" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="190" y="260" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#1f2328" text-anchor="middle">job.py</text>

  <rect x="330" y="210" width="1510" height="80" rx="10" fill="#eef1f4" stroke="#d0d7de" stroke-width="2"/>
  <text x="360" y="258" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#1f2328">spark-submit --master spark://host:7077 --conf spark.api.mode=connect job.py</text>

  <!-- switch -->
  <line x1="960" y1="290" x2="960" y2="320" stroke="#57606a" stroke-width="3"/>
  <circle cx="960" cy="320" r="5" fill="#57606a"/>
  <path d="M 960 320 L 500 320 L 500 360" fill="none" stroke="#d9531a" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <path d="M 960 320 L 1420 320 L 1420 360" fill="none" stroke="#8250df" stroke-width="3" marker-end="url(#arrow-purple)"/>

  <!-- classic column -->
  <text x="500" y="400" font-size="34" font-weight="700" fill="#b5400e" text-anchor="middle">classic</text>
  <text x="500" y="428" font-size="26" fill="#57606a" text-anchor="middle">the behavior when the key is unset</text>

  <rect x="160" y="454" width="680" height="50" rx="8" fill="#fff1e8" stroke="#d9531a" stroke-width="2"/>
  <text x="500" y="486" font-size="28" fill="#1f2328" text-anchor="middle">Python process</text>
  <line x1="500" y1="508" x2="500" y2="526" stroke="#d9531a" stroke-width="3" marker-end="url(#arrow-orange)"/>

  <rect x="160" y="530" width="680" height="50" rx="8" fill="#fff1e8" stroke="#d9531a" stroke-width="2"/>
  <text x="500" y="562" font-size="28" fill="#1f2328" text-anchor="middle">Py4J</text>
  <line x1="500" y1="584" x2="500" y2="602" stroke="#d9531a" stroke-width="3" marker-end="url(#arrow-orange)"/>

  <rect x="160" y="606" width="680" height="50" rx="8" fill="#fff1e8" stroke="#d9531a" stroke-width="2"/>
  <text x="500" y="638" font-size="28" fill="#1f2328" text-anchor="middle">Driver JVM</text>
  <line x1="500" y1="660" x2="500" y2="678" stroke="#d9531a" stroke-width="3" marker-end="url(#arrow-orange)"/>

  <rect x="160" y="682" width="680" height="50" rx="8" fill="#fff1e8" stroke="#d9531a" stroke-width="2"/>
  <text x="500" y="714" font-size="28" fill="#1f2328" text-anchor="middle">Cluster</text>

  <!-- connect column -->
  <text x="1420" y="400" font-size="34" font-weight="700" fill="#6639ba" text-anchor="middle">connect</text>

  <rect x="1080" y="454" width="680" height="50" rx="8" fill="#f3eeff" stroke="#8250df" stroke-width="2"/>
  <text x="1420" y="486" font-size="28" fill="#1f2328" text-anchor="middle">Spark starts a Connect server</text>
  <line x1="1420" y1="508" x2="1420" y2="526" stroke="#8250df" stroke-width="3" marker-end="url(#arrow-purple)"/>

  <rect x="1080" y="530" width="680" height="50" rx="8" fill="#f3eeff" stroke="#8250df" stroke-width="2"/>
  <text x="1420" y="562" font-size="28" fill="#1f2328" text-anchor="middle">Client sends plans over gRPC</text>
  <line x1="1420" y1="584" x2="1420" y2="602" stroke="#8250df" stroke-width="3" marker-end="url(#arrow-purple)"/>

  <rect x="1080" y="606" width="680" height="50" rx="8" fill="#f3eeff" stroke="#8250df" stroke-width="2"/>
  <text x="1420" y="638" font-size="28" fill="#1f2328" text-anchor="middle">Cluster</text>

  <!-- Selecting a Connect Server table -->
  <text x="80" y="782" font-size="32" font-weight="700" fill="#1f2328">Selecting a Connect Server</text>

  <rect x="80" y="800" width="1760" height="40" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="110" y="826" font-size="26" fill="#1f2328">Connect to a server that is already running</text>
  <text x="1100" y="826" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#57606a">spark.remote=sc://host:15002</text>

  <rect x="80" y="848" width="1760" height="40" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="110" y="874" font-size="26" fill="#1f2328">Have Spark start a local server</text>
  <text x="1100" y="874" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#57606a">spark.remote=local[*]</text>

  <rect x="80" y="896" width="1760" height="54" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="110" y="925" font-size="26" fill="#1f2328">Run against an existing cluster master</text>
  <text x="1100" y="918" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#57606a">spark.api.mode=connect</text>
  <text x="1100" y="942" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#57606a">with --master spark://host:7077</text>

  <text x="80" y="997" font-size="26" fill="#57606a">The submit command keeps its --master. One setting moves the job to Connect, and back.</text>

  <text x="80" y="1046" font-size="20" fill="#57606a">Source: blog post &#x00A7;6, Table 6-1</text>
</svg>
