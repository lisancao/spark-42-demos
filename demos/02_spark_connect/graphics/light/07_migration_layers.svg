<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"
     font-family="'Segoe UI', Arial, Helvetica, sans-serif">

  <defs>
    <pattern id="dotGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#d8dee4" opacity="0.6"/>
    </pattern>
    <marker id="arrowMuted" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0,0 7,4 0,8" fill="#57606a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#f6f8fa"/>
  <rect width="1920" height="1080" fill="url(#dotGrid)"/>
  <rect x="0" y="0" width="1920" height="6" fill="#d9531a"/>

  <!-- Corner brackets -->
  <g stroke="#d9531a" stroke-width="2" fill="none" opacity="0.35">
    <line x1="56" y1="56" x2="156" y2="56"/>
    <line x1="56" y1="56" x2="56" y2="156"/>
    <line x1="1864" y1="56" x2="1764" y2="56"/>
    <line x1="1864" y1="56" x2="1864" y2="156"/>
    <line x1="56" y1="1024" x2="156" y2="1024"/>
    <line x1="56" y1="1024" x2="56" y2="924"/>
    <line x1="1864" y1="1024" x2="1764" y2="1024"/>
    <line x1="1864" y1="1024" x2="1864" y2="924"/>
  </g>

  <!-- Title and subtitle -->
  <text x="80" y="104" font-size="48" font-weight="700" fill="#1f2328">The Seven Layers of a Spark Connect Migration</text>
  <text x="80" y="150" font-size="26" fill="#57606a">Only layer 0 is mandatory</text>

  <!-- Left: seven layer bands -->
  <!-- Row 0: Session Creation (blue), mandatory -->
  <rect x="80" y="210" width="1220" height="92" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <rect x="104" y="224" width="64" height="64" rx="8" fill="#ffffff" stroke="#0860ca" stroke-width="3"/>
  <text x="136" y="268" font-size="26" font-weight="700" fill="#0860ca" text-anchor="middle">L0</text>
  <text x="200" y="268" font-size="32" font-weight="700" fill="#1f2328">Session Creation</text>
  <text x="680" y="268" font-size="26" fill="#57606a">One call</text>
  <rect x="1080" y="238" width="160" height="36" rx="18" fill="#fff1e8" stroke="#d9531a" stroke-width="2"/>
  <text x="1160" y="262" font-size="20" font-weight="700" fill="#b5400e" text-anchor="middle">mandatory</text>

  <!-- Row 1: Pipeline Logic (green) -->
  <rect x="80" y="318" width="1220" height="92" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <rect x="104" y="332" width="64" height="64" rx="8" fill="#ffffff" stroke="#177a33" stroke-width="3"/>
  <text x="136" y="376" font-size="26" font-weight="700" fill="#177a33" text-anchor="middle">L1</text>
  <text x="200" y="376" font-size="32" font-weight="700" fill="#1f2328">Pipeline Logic</text>
  <text x="680" y="376" font-size="26" fill="#57606a">Audit; few changes</text>

  <!-- Row 2: Data Sources and Catalogs (amber) -->
  <rect x="80" y="426" width="1220" height="92" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <rect x="104" y="440" width="64" height="64" rx="8" fill="#ffffff" stroke="#875c00" stroke-width="3"/>
  <text x="136" y="484" font-size="26" font-weight="700" fill="#875c00" text-anchor="middle">L2</text>
  <text x="200" y="484" font-size="32" font-weight="700" fill="#1f2328">Data Sources and Catalogs</text>
  <text x="680" y="484" font-size="26" fill="#57606a">Configuration relocates to the server</text>

  <!-- Row 3: Configuration (orange-text) -->
  <rect x="80" y="534" width="1220" height="92" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <rect x="104" y="548" width="64" height="64" rx="8" fill="#ffffff" stroke="#b5400e" stroke-width="3"/>
  <text x="136" y="592" font-size="26" font-weight="700" fill="#b5400e" text-anchor="middle">L3</text>
  <text x="200" y="592" font-size="32" font-weight="700" fill="#1f2328">Configuration</text>
  <text x="680" y="592" font-size="26" fill="#57606a">Divides between client and server</text>

  <!-- Row 4: Dependencies (purple-text) -->
  <rect x="80" y="642" width="1220" height="92" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <rect x="104" y="656" width="64" height="64" rx="8" fill="#ffffff" stroke="#6639ba" stroke-width="3"/>
  <text x="136" y="700" font-size="26" font-weight="700" fill="#6639ba" text-anchor="middle">L4</text>
  <text x="200" y="700" font-size="32" font-weight="700" fill="#1f2328">Dependencies</text>
  <text x="680" y="700" font-size="26" fill="#57606a">Replaced by addArtifact</text>

  <!-- Row 5: Execution and Operations (red) -->
  <rect x="80" y="750" width="1220" height="92" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <rect x="104" y="764" width="64" height="64" rx="8" fill="#ffffff" stroke="#c5202c" stroke-width="3"/>
  <text x="136" y="808" font-size="26" font-weight="700" fill="#c5202c" text-anchor="middle">L5</text>
  <text x="200" y="808" font-size="32" font-weight="700" fill="#1f2328">Execution and Operations</text>
  <text x="680" y="808" font-size="26" fill="#57606a">Submission, logging and lifecycle change</text>

  <!-- Row 6: Security and Identity (teal) -->
  <rect x="80" y="858" width="1220" height="92" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <rect x="104" y="872" width="64" height="64" rx="8" fill="#ffffff" stroke="#08707a" stroke-width="3"/>
  <text x="136" y="916" font-size="26" font-weight="700" fill="#08707a" text-anchor="middle">L6</text>
  <text x="200" y="916" font-size="32" font-weight="700" fill="#1f2328">Security and Identity</text>
  <text x="680" y="916" font-size="26" fill="#57606a">Credentials leave the client</text>

  <!-- Right: order of work -->
  <rect x="1330" y="200" width="500" height="800" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="1362" y="250" font-size="34" font-weight="700" fill="#1f2328">Order of Work</text>
  <line x1="1362" y1="270" x2="1798" y2="270" stroke="#d0d7de" stroke-width="1"/>

  <!-- connectors -->
  <g stroke="#57606a" stroke-width="2" stroke-dasharray="4,4" opacity="0.6">
    <line x1="1394" y1="350" x2="1394" y2="403"/>
    <line x1="1394" y1="463" x2="1394" y2="516"/>
    <line x1="1394" y1="576" x2="1394" y2="629"/>
    <line x1="1394" y1="689" x2="1394" y2="742"/>
    <line x1="1394" y1="802" x2="1394" y2="855"/>
  </g>

  <!-- Step 1 -->
  <circle cx="1394" cy="330" r="20" fill="#ffffff" stroke="#d9531a" stroke-width="2"/>
  <text x="1394" y="338" font-size="22" fill="#b5400e" text-anchor="middle">1</text>
  <text x="1430" y="324" font-size="24" font-weight="700" fill="#1f2328">Layers 2 and 3</text>
  <text x="1430" y="354" font-size="22" fill="#57606a">Stand up the server</text>

  <!-- Step 2 -->
  <circle cx="1394" cy="443" r="20" fill="#ffffff" stroke="#d9531a" stroke-width="2"/>
  <text x="1394" y="451" font-size="22" fill="#b5400e" text-anchor="middle">2</text>
  <text x="1430" y="437" font-size="24" font-weight="700" fill="#1f2328">Layer 0</text>
  <text x="1430" y="467" font-size="22" fill="#57606a">Point one job at it</text>

  <!-- Step 3 -->
  <circle cx="1394" cy="556" r="20" fill="#ffffff" stroke="#d9531a" stroke-width="2"/>
  <text x="1394" y="564" font-size="22" fill="#b5400e" text-anchor="middle">3</text>
  <text x="1430" y="550" font-size="24" font-weight="700" fill="#1f2328">Layer 1</text>
  <text x="1430" y="580" font-size="22" fill="#57606a">Run the audit</text>

  <!-- Step 4 -->
  <circle cx="1394" cy="669" r="20" fill="#ffffff" stroke="#d9531a" stroke-width="2"/>
  <text x="1394" y="677" font-size="22" fill="#b5400e" text-anchor="middle">4</text>
  <text x="1430" y="663" font-size="24" font-weight="700" fill="#1f2328">Layer 4</text>
  <text x="1430" y="693" font-size="22" fill="#57606a">Move dependencies</text>

  <!-- Step 5 -->
  <circle cx="1394" cy="782" r="20" fill="#ffffff" stroke="#d9531a" stroke-width="2"/>
  <text x="1394" y="790" font-size="22" fill="#b5400e" text-anchor="middle">5</text>
  <text x="1430" y="776" font-size="24" font-weight="700" fill="#1f2328">Layer 5</text>
  <text x="1430" y="806" font-size="22" fill="#57606a">Update operations</text>

  <!-- Step 6 -->
  <circle cx="1394" cy="895" r="20" fill="#ffffff" stroke="#d9531a" stroke-width="2"/>
  <text x="1394" y="903" font-size="22" fill="#b5400e" text-anchor="middle">6</text>
  <text x="1430" y="889" font-size="24" font-weight="700" fill="#1f2328">Layer 6</text>
  <text x="1430" y="919" font-size="22" fill="#57606a">Remove client credentials last</text>

  <!-- Footer -->
  <text x="80" y="1046" font-size="20" fill="#57606a">Source: companion guide &#xa7;9, Table 9-1</text>
</svg>
