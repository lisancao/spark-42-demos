<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
  <defs>
    <pattern id="dotgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#d8dee4" opacity="0.6"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="#f6f8fa"/>
  <rect x="0" y="0" width="1920" height="1080" fill="url(#dotgrid)"/>
  <rect x="0" y="0" width="1920" height="6" fill="#d9531a"/>

  <g stroke="#d9531a" stroke-width="3" opacity="0.35" fill="none">
    <path d="M 30 90 L 30 30 L 90 30"/>
    <path d="M 1830 30 L 1890 30 L 1890 90"/>
    <path d="M 30 990 L 30 1062 L 64 1062"/>
    <path d="M 1890 990 L 1890 1062 L 1856 1062"/>
  </g>

  <text x="80" y="104" font-size="48" font-weight="700" fill="#1f2328">Shipping Python Dependencies</text>
  <text x="80" y="150" font-size="26" fill="#57606a">SparkSession.addArtifact under Spark Connect</text>

  <!-- Column 1: Spark Classic mechanisms -->
  <rect x="80" y="210" width="560" height="570" rx="12" fill="#fff1e8" stroke="#d9531a" stroke-width="2"/>
  <text x="110" y="262" font-size="32" font-weight="700" fill="#b5400e">Spark Classic Mechanisms</text>

  <text x="110" y="340" font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#1f2328">--py-files</text>
  <text x="110" y="374" font-size="24" fill="#57606a">a spark-submit option with no</text>
  <text x="110" y="404" font-size="24" fill="#57606a">client equivalent</text>

  <text x="110" y="500" font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#1f2328">SparkContext.addPyFile()</text>
  <text x="110" y="534" font-size="24" fill="#57606a">SparkContext is unavailable</text>
  <text x="110" y="564" font-size="24" fill="#57606a">under Connect</text>

  <text x="110" y="660" font-size="26" fill="#1f2328">conda-pack, venv-pack and PEX</text>
  <text x="110" y="694" font-size="24" fill="#57606a">documented for Spark Classic</text>

  <!-- Column 2: spark.addArtifact -->
  <rect x="680" y="210" width="560" height="570" rx="12" fill="#f3eeff" stroke="#8250df" stroke-width="3"/>
  <text x="710" y="262" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#6639ba">spark.addArtifact(path, ...)</text>

  <text x="710" y="352" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#6639ba">pyfile=True</text>
  <text x="710" y="386" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#1f2328">.py, .zip, .egg, .jar</text>
  <text x="710" y="420" font-size="24" fill="#57606a">added to the executors' PYTHONPATH</text>

  <text x="710" y="476" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#6639ba">archive=True</text>
  <text x="710" y="510" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#1f2328">.zip, .tar.gz, .tgz, .tar</text>
  <text x="710" y="544" font-size="24" fill="#57606a">unpacked on the executors</text>

  <text x="710" y="600" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#6639ba">file=True</text>
  <text x="710" y="634" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#1f2328">any file</text>
  <text x="710" y="668" font-size="24" fill="#57606a">copied as is</text>

  <!-- Column 3: three-step check -->
  <rect x="1280" y="210" width="560" height="570" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <circle cx="1328" cy="254" r="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="1328" y="262" font-size="24" font-weight="700" fill="#1f2328" text-anchor="middle">1</text>
  <text x="1360" y="262" font-size="26" fill="#1f2328">UDF fails:</text>
  <text x="1360" y="296" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#c5202c">ModuleNotFoundError: No module</text>
  <text x="1360" y="326" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#c5202c">named 'geo'</text>

  <circle cx="1328" cy="382" r="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="1328" y="390" font-size="24" font-weight="700" fill="#1f2328" text-anchor="middle">2</text>
  <text x="1360" y="390" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#1f2328">spark.addArtifact(</text>
  <text x="1380" y="420" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#1f2328">"pipeline/lib/geo.py",</text>
  <text x="1380" y="450" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#1f2328">pyfile=True)</text>

  <circle cx="1328" cy="510" r="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="1328" y="518" font-size="24" font-weight="700" fill="#1f2328" text-anchor="middle">3</text>
  <text x="1360" y="518" font-size="26" fill="#1f2328">UDF runs:</text>
  <text x="1360" y="548" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#177a33">Montreal 503.9 km</text>

  <!-- Install on the Server Instead -->
  <rect x="80" y="800" width="1760" height="190" rx="12" fill="#ffeef0" stroke="#c5202c" stroke-width="2"/>
  <text x="110" y="842" font-size="32" font-weight="700" fill="#c5202c">Install on the Server Instead</text>
  <text x="110" y="898" font-size="26" fill="#1f2328">JARs for catalogs and extensions</text>
  <text x="990" y="898" font-size="26" fill="#1f2328">native libraries</text>
  <text x="110" y="940" font-size="26" fill="#1f2328">classes named in spark.sql.extensions</text>
  <text x="990" y="940" font-size="26" fill="#1f2328">transitive JAR dependencies are not resolved</text>

  <text x="80" y="1046" font-size="20" fill="#57606a">Source: companion guide &#x00A7;9, Table 9-4; examples/08_add_artifact.py</text>
</svg>
