<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spark Connect video cards</title>
<style>
:root{--bg:#1a1a19;--panel:#252523;--ink:#fff;--muted:#c3c2b7;--client:#3987e5;--server:#d95926;--exec:#199e70;--plan:#9085e9;--arrow:#c98500;--removed:#e66767;--added:#008300}*{box-sizing:border-box}html,body{margin:0;background:#000;color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}.deck{width:100vw;height:100vh;display:grid;place-items:center}.slide{display:none;position:absolute;width:min(100vw,177.7778vh);height:min(56.25vw,100vh);padding:5% 6%;background:var(--bg);overflow:hidden}.slide.active{display:flex;flex-direction:column}.kicker,.source,.count{color:var(--muted);font-size:1.25cqw}.title{font-size:4.1cqw;line-height:1.05;margin:.5cqw 0 1.5cqw}.body{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}.source{position:absolute;bottom:4%;left:6%;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.count{position:absolute;bottom:4%;right:6%;font-variant-numeric:tabular-nums}.legend{position:absolute;right:6%;top:6%;display:flex;gap:1cqw;font-size:1cqw;color:var(--muted)}.legend i{display:inline-block;width:.7cqw;height:.7cqw;border-radius:50%;margin-right:.3cqw}.fact{font-size:3.3cqw;line-height:1.2;font-weight:700;max-width:88%}.big{font-size:7cqw;line-height:1;font-weight:800}.sub{font-size:1.7cqw;line-height:1.35;color:var(--muted);margin-top:1cqw}.code{white-space:pre-wrap;width:92%;max-height:78%;overflow:hidden;background:var(--panel);border:2px solid #494944;border-radius:1cqw;padding:1.7cqw 2cqw;font:1.35cqw/1.42 ui-monospace,SFMono-Regular,Consolas,monospace}.flow,.chips{display:flex;align-items:center;justify-content:center;gap:1cqw;flex-wrap:wrap;width:95%}.node{padding:1.3cqw 1.6cqw;border:3px solid #555;border-radius:1cqw;background:var(--panel);font-size:1.55cqw;font-weight:700;text-align:center}.client{border-color:var(--client)}.server{border-color:var(--server)}.executor{border-color:var(--exec)}.plan{border-color:var(--plan)}.error{border-color:var(--removed)}.ok{border-color:var(--added)}.arrow{color:var(--arrow);font:700 1.4cqw ui-monospace,SFMono-Regular,Consolas,monospace;text-align:center}.chip{padding:.65cqw 1cqw;border:2px solid #555;border-radius:2cqw;font:1.25cqw ui-monospace,SFMono-Regular,Consolas,monospace}.chip.error{border-color:var(--removed)}.chip.ok{border-color:var(--added)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.8cqw;width:92%}.cell{padding:1cqw;background:var(--panel);border:1px solid #4a4a46;border-radius:.7cqw;font-size:1.15cqw;line-height:1.35}.cell b{display:block;font-size:1.35cqw;margin-bottom:.25cqw}.compare{display:grid;grid-template-columns:1fr 1fr;gap:1.6cqw;width:92%}.panel{padding:1.5cqw;background:var(--panel);border-radius:1cqw;border-left:.45cqw solid var(--removed);white-space:pre-wrap;font:1.25cqw/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}.panel.after{border-color:var(--added)}.panel b{display:block;font-family:ui-sans-serif,system-ui;margin-bottom:.7cqw}.minus{color:var(--removed)}.plus{color:#59bd70}.gotcha{width:88%;background:var(--panel);border:2px solid var(--removed);border-radius:1cqw;overflow:hidden}.gotcha header{padding:.7cqw 1.4cqw;background:var(--removed);font-size:1.4cqw;font-weight:800}.gotcha div{padding:1.4cqw 1.8cqw}.gotcha code{display:block;color:var(--muted);font-size:1.25cqw;margin-bottom:1cqw}.gotcha strong{font-size:2.15cqw;line-height:1.3}.bars{width:82%}.barrow{display:grid;grid-template-columns:14cqw 1fr 7cqw;gap:1cqw;align-items:center;margin:1.2cqw 0;font-size:1.4cqw}.bar{height:4cqw;background:var(--plan)}.bar.small{width:43.78%;opacity:.65}.stack{display:flex;flex-direction:column;align-items:center;gap:.8cqw}.screen{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style></head><body><main id="deck" class="deck"></main><div id="status" class="screen" aria-live="polite"></div>
<script>
const F=(text,sub='')=>`<div><div class="fact">${text}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;

const cards=[

['B-3','Spotlight: ExecutePlan','stat',F('Execute a plan; results stream back as Arrow.'),'blog:228'],
['B-4','Spotlight: ReleaseExecute','stat',F('why buffered results get discarded.'),'blog:246','Ambiguity: only this purpose phrase is supplied.'],

['B-7','Reattach after a drop','diagram',Flow(N('Client · ExecutePlan','client'),N('edge breaks mid Arrow stream','error'),N('Server stays lit · ReattachExecute by operation ID · stream resumes','server')),'blog:250 · SPARK-55406'],
['B-8','Plan compression is negotiated','code',F("threshold + algorithm fetched from the server; zstandard only if installed; disabled for the session if the server can't read a compressed plan."),'blog:255'],
['B-9','explain() prints the server\'s plan','code',Code('AdaptiveSparkPlan … HashAggregate…'),'blog §2 · Observing the Division of Labor','Ambiguity: only this abbreviated snippet is supplied.'],
['B-10','The six protocol files','code',Grid([['base.proto','RPCs, Plan'],['relations.proto','Relation tree'],['expressions.proto'],['commands.proto'],['types.proto'],['catalog.proto']]),'Table 12-1 · blog:~1244'],

['C-2','pyspark-client','stat',F('19 MB · no JARs · no JDK · sc:// only'),'blog:~305'],

['C-4','96% / 100%','stat','<div><div class="big">96% / 100%</div><div class="sub">pyspark/ 481→19 MB (96%); Spark JARs 456→0 MB (100%).</div></div>',''],

['D-2','--wait in a container','stat','<div><div class="big">--wait</div><div class="sub">SPARK_NO_DAEMONIZE=1</div></div>','blog §4'],

['D-6','Server config defaults','code',Grid([['binding.address','none; all interfaces / 4.0.0'],['binding.port','15002'],['port.maxRetries','0'],['maxInboundMessageSize','134217728'],['arrow.maxBatchSize','4m']]),'Table 4-1 · blog:410–415'],
['E-1','The default binds everything','compare',BA('binding.address unset → all interfaces','binding.address=127.0.0.1'),'start-connect-server.sh:15,29 · TOPOLOGIES.md:168'],

['E-3','A token enables TLS','stat',F('A token enables TLS','bearer never sent in the clear.'),'blog §5'],

['F-1','Six topologies','code',Chips(['in-process','same-host','remote standalone','Kubernetes','YARN cluster (SPARK-55239)','multi-cluster']),'Table 4-2 · blog §4'],

['F-3','doctor.py catches it','code',Code('python tools/doctor.py --remote sc://localhost:15002 --expect-version 4.2\n→ FAIL, exit 1'),'TOPOLOGIES.md:140'],

['G-1','The unsupported surface','code',Chips(['_jvm','_jsc','sparkContext','newSession','.rdd','setLogLevel','addPyFile','broadcast vars','accumulators via SparkContext'],'error'),'blog §7'],
['G-2','enableHiveSupport() is silent','gotcha',G('enableHiveSupport()','[CANNOT_MODIFY_STATIC_CONFIG] UserWarning','catalogImplementation stays in-memory.'),'blog §7'],
['G-3','Observation, not accumulators','code',Code('Observation("rows")\ndf.observe(...)\nobs.get["n"]'),'blog §7'],
['G-4','broadcast: hint vs variable','code',BA('SparkContext.broadcast(value) · Unavailable','functions.broadcast(df) · Supported'),'Table 7-1 · blog §7'],
['G-5','getOrCreate returns the cached session','gotcha',G('a=…remote("sc://good…"); b=…remote("sc://127.0.0.1:1").getOrCreate();','assert b is a','passes. Use builder.create().'),'blog §7'],
['G-6','New in 4.2','code',Chips(['zipWithIndex','toJSON','read.json/xml/csv accept a DataFrame','emptyDataFrame(schema)','head/take/tail avoid full scans'],'ok'),'Table 7-2 · blog §7'],
['H-1','What moved from eager to lazy','code',Grid([['schema analysis','Eager→Lazy'],['schema access','Local→remote AnalyzePlan'],['temp views','plan→name'],['UDF','at def→at exec']]),'Table 8-1 · blog §8'],
['H-2','Temp view resolves by name','gotcha',G('first=spark.table("brands") then replace brands with b','first.count() = a (Classic) vs b (Connect)'),'fig8-1 · blog §8'],
['H-3','UDF captures at execution','gotcha',G('verbatim closure example','123 vs 456'),'blog §8','Ambiguity: the closure example itself is not supplied.'],
['H-4','Deferred analysis error escapes the try','gotcha',G('df.filter(col("typo")&gt;6)','raises later, not in the try.'),'blog §8'],
['H-5','Schema access = a round trip','compare',BA('if name not in df.columns inside a loop (one AnalyzePlan each)','read df.columns once + single select'),'blog §8'],
['I-1','ModuleNotFoundError: pyarrow','gotcha',G('Spark 4.2 enables Arrow UDFs by default (SPARK-54555); official image lacks PyArrow','every Python UDF fails','toPandas() still works.'),'blog:732–739'],
['I-2','Three fixes','code',Grid([['udf(..., useArrow=False)','one UDF'],['spark.sql.execution.pythonUDF.arrow.enabled=false','UDFs after'],['add PyArrow to the image','all UDFs — this project\'s Dockerfile: pyarrow 25.0.1, pandas 2.3.3']]),'blog:736–739'],
['I-3','ArrowDeserializer binds by position','stat',F('duplicate column names.'),'SPARK-56007 · blog §7'],
['I-4','Python minor versions must match','gotcha',G('client vs executors · image ships Python 3.10.12','[PYTHON_VERSION_MISMATCH] … 3.10 than that in driver: 3.12'),'blog §7'],
['J-0','The seven layers','code',Chips(['0 session','1 logic','2 sources/catalogs','3 config','4 deps','5 exec/ops','6 security']),'Table 9-1 · blog:892'],
['J-L0','Layer 0 — session creation','compare',BA('SparkSession.builder.appName("orders-pipeline").getOrCreate() · pipeline_before.py:20','builder.remote(remote).getOrCreate() · pipeline_after.py:26')+'<div class="sub">may need no code change with spark.api.mode=connect</div>','blog:877'],
['J-L1','Layer 1 — pipeline logic (audit RDD)','compare',BA('if events.rdd.isEmpty(): · pipeline_before.py:30','if events.isEmpty(): · pipeline_after.py:38'),''],
['J-L2','Layer 2 — sources & catalogs','compare',BA('INPUT = str(HERE / "input") · :13','INPUT = os.environ.get("PIPELINE_INPUT", "/demo/pipeline/input") · :15')+'<div class="sub">paths resolve on the server.</div>',''],
['J-L3','Layer 3 — config splits','compare',BA('.config("spark.sql.shuffle.partitions","8").enableHiveSupport() · :22','spark.conf.set("spark.sql.shuffle.partitions","8") · :34')+'<div class="sub">server-only: spark.sql.extensions · spark.jars · spark.sql.catalog.iceberg</div>',''],
['J-L4','Layer 4 — dependencies → addArtifact','compare',BA('spark.sparkContext.addPyFile(...geo.py) · :27','spark.addArtifact(...geo.py, pyfile=True) · :35'),''],
['J-L5','Layer 5 — execution & ops','compare',BA('docker exec … spark-submit /scripts/_load_to_iceberg.py · blog:1081','SPARK_REMOTE=sc://localhost:15002 python pipeline.py · blog:1088'),''],
['J-L6','Layer 6 — security','stat',F('clients no longer need catalog or storage credentials; keep catalog creds on server/driver, give executors only the storage access they need.'),'blog §9'],
['J-1','Order of operations','diagram',Flow(N('1 · L2+L3 server+preflight'),N('2 · L0 · spark.api.mode · [reversible]','ok'),N('3 · L1 audit'),N('4 · L4 addArtifact'),N('5 · L5 logs/checkpoints'),N('6 · L6 remove creds · [not easily reversed, red]','error')),'blog:~1130'],
['J-2','client/server boundary','diagram',Grid([['shuffle.partitions','→session'],['addArtifact','→executors PYTHONPATH'],['spark.sql.extensions','refused (CANNOT_MODIFY_STATIC_CONFIG)'],['spark.jars',"can't change classpath"]]),'fig9-1 · blog §9'],
['J-3','One line of 357','stat','<div><div class="big">1 of 357</div><div class="sub">lines fails: setLogLevel<br>21 blocking findings across 24 files, all the same call.</div></div>','blog §9'],
['J-4','preflight()','code',Code('preflight()\nSHOW NAMESPACES → SystemExit'),'blog §9 · pipeline_after.py:93','Ambiguity: the full verbatim function is not supplied.'],
['K-1','Upgrade hazards','code',Grid([['PyArrow','15.0.0→18.0.0'],['arrow.pyspark.enabled','default true'],['pythonUDF.arrow.enabled','default true (SPARK-54555)'],['pythonUDTF.arrow.enabled','true'],['PyPy','dropped']]),'Table 10-1 · blog:1160'],
['K-2','JDK 25','gotcha',G('pre-4.2 client · JDK 25','Arrow/Netty allocator failure on JDK 25; ExceptionInInitializerError in EmptyByteBuf.memoryAddress','JDK 17/21 unaffected.'),'SPARK-56955 · blog §11'],
['L-1','357 lines · 10 tables','stat','<div><div class="big">10 Iceberg tables</div>'+Grid([['bronze · 5','dim_categories · dim_brands · dim_items · dim_locations · orders'],['silver · 2','orders_enriched · order_lifecycle'],['gold · 3','hourly_metrics · delivery_performance · brand_summary']])+'</div>','case_study/lakehouse_stack/pipeline_after.py:257–423'],
['L-2','Pipeline.run() call tree','code',Code("Pipeline.run()                                   # :191\n├── preflight(self.spark, self.catalog)          # :194\n├── self._get_execution_order()                  # :195  topological sort from spark.table() deps\n└── for table in order:\n      ├── df = info['func']()                     # the @materialized_view function\n      ├── df.write.mode(\"overwrite\").saveAsTable(full_name)   # :222\n      └── SELECT COUNT(*) … report row count      # :224"),'pipeline_after.py:191'],
['M-1','Anatomy of any client','diagram',Flow(N('DataFrame calls','client'),N('plan builder · Relation/Expression','plan'),N('gRPC transport · session id, retries, reattach','client'),N('Connect server','server'))+'<div class="sub">Arrow back → decoder → RecordBatches → Polars.</div>','fig12-1 · blog §12'],
['M-2','Five clients today','code',Chips(['Python','Scala/Java','Go v0.1.0','Swift 0.7.0','Rust 4.2.0']),'Table 12-2'],
['M-3','Rust + Polars: 5,000,000 → 7','diagram',Flow(N('Spark aggregates 5,000,000 rows','executor'),N('7 groups · Arrow IPC','plan'),N('Polars DataFrame locally','client'))+'<div class="sub">run 0.26–0.34 s.</div>','blog §12'],

];
const deck=document.getElementById('deck'),legend='<aside class="legend"><span><i style="background:var(--client)"></i>Client</span><span><i style="background:var(--server)"></i>Server / driver</span><span><i style="background:var(--exec)"></i>Executors</span></aside>';
cards.forEach(([id,title,type,body,source,note],i)=>{const s=document.createElement('section');s.className='slide'+(i?'':' active');s.dataset.cardId=id;s.setAttribute('aria-label',`${id}: ${title}`);s.innerHTML=`${type==='diagram'?legend:''}<div class="kicker">Spark Connect</div><h1 class="title">${title}</h1><div class="body">${body}</div>${source?`<div class="source">${source}</div>`:''}<div class="count">${id} · ${i+1}/${cards.length}</div>`;if(note)s.appendChild(document.createComment(` Motion / reveal / ambiguity: ${note} `));deck.appendChild(s)});
let at=0,slides=[...document.querySelectorAll('.slide')],status=document.getElementById('status');function show(n){slides[at].classList.remove('active');at=(n+slides.length)%slides.length;slides[at].classList.add('active');status.textContent=`${cards[at][0]} · ${at+1}/${cards.length}`;history.replaceState(null,'',`#${cards[at][0]}`)}const wanted=cards.findIndex(c=>c[0]===decodeURIComponent(location.hash.slice(1)));if(wanted>0)show(wanted);addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();show(at+1)}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();show(at-1)}else if(e.key==='Home')show(0);else if(e.key==='End')show(slides.length-1)});
