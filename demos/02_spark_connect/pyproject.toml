[project]
name = "spark-connect-demo"
version = "0.3.0"
description = "Spark Connect on Apache Spark 4.2: examples, a pipeline migration, and supporting tools"
readme = "README.md"
# Python 3.10 matches the official apache/spark:4.2.0 image. Python UDFs require the same minor
# version on the client and the executors.
requires-python = "==3.10.*"
dependencies = []

[dependency-groups]
# The Python client with no JVM. PySpark warns against pandas 3, so pandas is pinned below 3.
client = ["pyspark-client==4.2.0", "pandas<3"]
# The full distribution with Connect support, for Spark Classic examples and in-process mode.
full = ["pyspark[connect]==4.2.0", "pandas<3"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff"]

[tool.uv]
package = false
default-groups = ["client", "dev"]
conflicts = [[{ group = "client" }, { group = "full" }]]
compile-bytecode = true

[tool.pytest.ini_options]
pythonpath = [".", "tools", "pipeline"]
testpaths = ["tests"]
addopts = "-q --timeout=180"
markers = ["connect: requires a reachable Spark Connect server (SPARK_REMOTE)"]

[tool.ruff]
line-length = 100
target-version = "py310"
# The case study's pipeline files contain production code copied without changes.
extend-exclude = [
    "case_study/lakehouse_stack/pipeline_before.py",
    "case_study/lakehouse_stack/pipeline_after.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
