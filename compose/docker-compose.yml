# Spark 4.2 demos: shared sandbox. The Spark Connect demo (demos/02_spark_connect) has its own
# compose.yaml and does not use this file.
#
# Isolated from ~/lakehouse-stack: its own bridge network, volumes and compose project name, with
# every port bound to 127.0.0.1.
#
# Setup does not start this stack. Start and stop it with:
#     docker compose -p spark42demos -f compose/docker-compose.yml up -d
#     docker compose -p spark42demos -f compose/docker-compose.yml down -v   # also removes volumes
#
# Image (updated 2026-09-09): Apache Spark 4.2.0 was released on 2026-07-14, so the default is the
# official `apache/spark:4.2.0-scala2.13-java21-python3-ubuntu`. Java 21 matches the lakehouse-stack
# images, and the variant without `-r` omits SparkR.
#
# The previous default, the source-built snapshot `lakehouse/spark:5.0.0-snapshot-cdc`, reports
# `5.0.0-SNAPSHOT` rather than 4.2. It remains as the `snapshot` profile because Demo 1 (metric
# views) and the AUTO CDC work were verified against it:
#     docker compose -p spark42demos -f compose/docker-compose.yml --profile snapshot up -d
#
# `spark.connect.grpc.port.maxRetries` defaults to 0, so a port clash stops the server instead of
# moving it to the next port.

services:
  # ---------------------------------------------------------------------------------------------
  # Spark Connect server on Apache Spark 4.2.0, without Iceberg, so nothing is downloaded with
  # --packages at startup.
  # ---------------------------------------------------------------------------------------------
  spark:
    image: ${SPARK_IMAGE:-apache/spark:4.2.0-scala2.13-java21-python3-ubuntu}
    container_name: spark42demos-connect
    networks: [spark42demos_net]
    env_file: .env
    ports:
      - "127.0.0.1:${CONNECT_PORT:-15099}:15002"   # Spark Connect (gRPC), localhost only
      - "127.0.0.1:${MASTER_UI_PORT:-8190}:8190"   # Spark UI
    volumes:
      - spark42demos_data:/opt/spark-data
      - ../demos:/demos:ro
      - ../data:/data
      # The project is mounted at its host path, so an absolute path sent by a client on this
      # machine names the same file on the server, where Spark Connect resolves file paths.
      - ${PROJECT_HOST_DIR:-/home/lnc/Documents/spark_content/spark_42_demos}:${PROJECT_HOST_DIR:-/home/lnc/Documents/spark_content/spark_42_demos}
    extra_hosts:
      - host.docker.internal:host-gateway
    command:
      - bash
      - -c
      - >-
        /opt/spark/sbin/start-connect-server.sh --wait
        --conf spark.connect.grpc.binding.address=0.0.0.0
        --conf spark.connect.grpc.binding.port=15002
        --conf spark.ui.port=8190

  # ---------------------------------------------------------------------------------------------
  # Source-built snapshot server, kept for Demo 1 (metric views) and the AUTO CDC work, which were
  # verified against it. Start it with --profile snapshot. It reports 5.0.0-SNAPSHOT, so it is not
  # suitable for material labeled Spark 4.2.
  # ---------------------------------------------------------------------------------------------
  spark-snapshot:
    profiles: ["snapshot"]
    image: lakehouse/spark:5.0.0-snapshot-cdc
    container_name: spark42demos-connect-snapshot
    networks: [spark42demos_net]
    env_file: .env
    ports:
      - "127.0.0.1:${CONNECT_PORT_SNAPSHOT:-15097}:15002"
      - "127.0.0.1:${UI_PORT_SNAPSHOT:-8186}:8186"
    volumes:
      - spark42demos_data:/opt/spark-data
      - ../demos:/demos:ro
      - ../data:/data
      - ${PROJECT_HOST_DIR:-/home/lnc/Documents/spark_content/spark_42_demos}:${PROJECT_HOST_DIR:-/home/lnc/Documents/spark_content/spark_42_demos}
    extra_hosts:
      - host.docker.internal:host-gateway
    command:
      - bash
      - -c
      - >-
        /opt/spark/sbin/start-connect-server.sh
        --packages org.apache.iceberg:iceberg-spark-runtime-4.1_2.13:1.11.0
        --conf spark.connect.grpc.binding.port=15002
        --conf spark.ui.port=8186
        && sleep 5 && tail -f /opt/spark/logs/*.out

networks:
  spark42demos_net:
    name: spark42demos_net
    driver: bridge

volumes:
  spark42demos_data:
    name: spark42demos_data
    driver: local
